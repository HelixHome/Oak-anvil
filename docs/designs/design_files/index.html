<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oak &amp; Anvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ---- Spacing scale (8px base) ---- */
    --sp-1: 4px;  --sp-2: 8px;   --sp-3: 16px; --sp-4: 24px;
    --sp-5: 32px; --sp-6: 48px;  --sp-7: 64px; --sp-8: 96px;
    --sp-9: 128px; --sp-10: 160px; --sp-11: 192px;

    /* ---- Palette: warm neutrals only ---- */
    --ivory: #F7F5F1;
    --bone:  #F1EEE7;
    --sand:  #E9E4DA;
    --stone: #DED8CC;
    --charcoal: #2B2B2B;
    --charcoal-soft: #4A4843;
    --greige: #8A8276;       /* muted text */
    --taupe:  #8B7355;       /* whisper accent (from logo) */
    --hair: rgba(43, 43, 43, 0.16);
    --hair-soft: rgba(43, 43, 43, 0.09);

    /* ---- Type ---- */
    --font-head: 'Bodoni Moda', serif;
    --font-body: 'Jost', sans-serif;
    --font-mono: 'Space Mono', monospace;

    --maxw: 1480px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  body {
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--charcoal);
    background: var(--ivory);
    line-height: 1.65;
    letter-spacing: 0.01em;
  }

  /* ---- Type ramp ---- */
  .t-display {
    font-family: var(--font-head);
    font-weight: 400;
    font-size: clamp(38px, 5.2vw, 82px);
    line-height: 1.04;
    letter-spacing: 0.04em;
  }
  .t-h1 {
    font-family: var(--font-head);
    font-weight: 400;
    font-size: clamp(30px, 3.4vw, 52px);
    line-height: 1.1;
    letter-spacing: 0.05em;
  }
  .t-h2 {
    font-family: var(--font-head);
    font-weight: 400;
    font-size: clamp(24px, 2.2vw, 34px);
    line-height: 1.18;
    letter-spacing: 0.06em;
  }
  .t-h3 {
    font-family: var(--font-head);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0.04em;
  }
  .eyebrow {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.34em;
    white-space: nowrap;
    color: var(--greige);
  }
  .caps {
    text-transform: uppercase;
    letter-spacing: 0.26em;
  }
  .t-body { font-size: 16px; font-weight: 300; line-height: 1.75; }
  .t-small { font-size: 13.5px; font-weight: 300; line-height: 1.7; }
  .t-micro {
    font-size: 11px; font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.24em;
  }
  .mono {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* serif-direction tuning: Baskerville/Jost need different tracking */
  [data-head="Libre Baskerville"] .t-display { letter-spacing: 0.02em; font-size: clamp(34px, 4.4vw, 66px); }
  [data-head="Libre Baskerville"] .t-h1 { letter-spacing: 0.03em; }
  [data-head="Jost"] .t-display,
  [data-head="Jost"] .t-h1,
  [data-head="Jost"] .t-h2,
  [data-head="Jost"] .t-h3 { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 400; }
  [data-head="Jost"] .t-display { font-size: clamp(34px, 4.6vw, 70px); letter-spacing: 0.12em; }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--taupe); color: var(--ivory); }

  /* ---- Reusable link/underline reveal ---- */
  .link-reveal {
    position: relative;
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.26em;
    padding-bottom: 4px;
    cursor: pointer;
    color: var(--charcoal);
    background: none; border: none; font-family: var(--font-body);
  }
  .link-reveal::after {
    content: "";
    position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(1);
    transform-origin: left;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .link-reveal.reveal::after { transform: scaleX(0); }
  .link-reveal.reveal:hover::after { transform: scaleX(1); }

  /* ---- Buttons ---- */
  .btn {
    font-family: var(--font-body);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.26em;
    padding: 17px 38px;
    border: 1px solid var(--charcoal);
    background: transparent;
    color: var(--charcoal);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:hover { background: var(--charcoal); color: var(--ivory); }
  .btn-solid { background: var(--charcoal); color: var(--ivory); }
  .btn-solid:hover { background: #000; }
  .btn-light { border-color: rgba(247,245,241,0.7); color: var(--ivory); }
  .btn-light:hover { background: var(--ivory); color: var(--charcoal); border-color: var(--ivory); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  input, select, textarea, button { font-family: var(--font-body); }

  /* ---- Scroll reveal ---- */
  .reveal-up { opacity: 0; transform: translateY(26px); transition: opacity 1.1s cubic-bezier(0.22,1,0.36,1), transform 1.1s cubic-bezier(0.22,1,0.36,1); }
  .reveal-up.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .reveal-up { opacity: 1; transform: none; transition: none; }
  }

  /* hide scrollbar on thumbnail rails */
  .no-bar::-webkit-scrollbar { display: none; }
  .no-bar { scrollbar-width: none; }

  /* placeholder hover zoom */
  .oa-ph-zoom { transition: transform 1.4s cubic-bezier(0.22,1,0.36,1); }
  button:hover > .oa-ph-zoom, a:hover > .oa-ph-zoom, .oa-ph-zoom:hover { transform: scale(1.045); }

  #root { min-height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="pages-shop.jsx"></script>
  <script type="text/babel" src="pages-trade.jsx"></script>
  <script type="text/babel" src="pages-dashboard.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
